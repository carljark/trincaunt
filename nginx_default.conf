server {
    server_name co2univ.ddns.net;
    types_hash_max_size 8192;

    location / {
        # Puerto en el que se ejecuta tu API de Node.js
        proxy_pass http://localhost:5200;

        # Cabeceras importantes para el proxy inverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DEVELOP
    location /develop/ {
        proxy_pass http://localhost:5300/;
        # Cabeceras importantes para el proxy inverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx intercepta las peticiones de la API de develop y se las pasa al Node secundario
    location /api-dev/ {
        # Lo mismo: la barra final hace que le quite "/api-dev"
        # y al Node secundario le llegue "/login", "/projects", etc.
        proxy_pass http://localhost:5300/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/co2univ.ddns.net-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/co2univ.ddns.net-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = co2univ.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name co2univ.ddns.net;
    return 404; # managed by Certbot


}
server {
    listen 80;
    server_name plappin.duckdns.org;
    types_hash_max_size 8192;

    # Backend Node.js de la Plataforma de Proyectos Interdisciplinares (Plappin)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M; # Permite subir PDFs de buen tamaño
    }

    # Frontend Angular (servido por el Nginx interno de Docker)
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    # IMPORTANTE: Cambia "trincaunt.ddns.net" por el dominio o subdominio real que vayas a usar
    server_name trincaunt.ddns.net;
    types_hash_max_size 8192;

    location / {
        # Puerto 3000 de nuestro contenedor trincaunt-app en EC2
        proxy_pass http://localhost:3100;
        client_max_body_size 50M;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
