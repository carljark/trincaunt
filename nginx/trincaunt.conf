# Site propio de Trincaunt. Se instala como /etc/nginx/sites-available/trincaunt
# (+ symlink en sites-enabled) para no tocar la config de las otras apps del EC2.
# Certbot añade aquí el bloque HTTPS al ejecutarse.

# Nombre de variable propio para no chocar con un `map` igual en otros sites.
map $http_upgrade $trincaunt_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name trincaunt.ddns.net;
    types_hash_max_size 8192;

    location / {
        # Contenedor trincaunt-app (publicado solo en 127.0.0.1:3100)
        proxy_pass http://127.0.0.1:3100;
        client_max_body_size 50M;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trincaunt_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
