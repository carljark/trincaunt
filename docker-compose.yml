services:
  trincaunt-app:
    # En el EC2 la imagen llega ya construida (scripts/sync_to_ec2.sh) y se arranca con --no-build;
    # `build` queda para levantarla en local con `docker compose up --build`.
    image: trincaunt-app:latest
    build: .
    container_name: trincaunt-app
    restart: unless-stopped
    ports:
      # Solo local: nginx del host hace de proxy inverso
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/trincaunt
      # Lee las claves desde el archivo .env donde lances el docker-compose
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Notificaciones push; sin ellas la app funciona pero no envía avisos
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-https://trincaunt.ddns.net}
    depends_on:
      - mongo

  mongo:
    image: mongo:4.4
    container_name: trincaunt-mongo
    restart: unless-stopped
    # Sin `ports`: Mongo (sin autenticación) solo es accesible desde la red de compose
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
